spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/changlongdb?useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 本地文件上传配置
elephant:
  upload:
    path: uploads
    access-path: /uploads
  recognition:
    predict-url: https://recognize.liangzhihuamei.xyz/predict
    predict-video-url: https://recognize.liangzhihuamei.xyz/predict-video
    public-base-url: http://localhost:8082
    known-threshold: 75
    review-threshold: 45

sky:
  jwt:
    # HS256 要求密钥长度 >= 256 bits（至少 32 个字符）
    admin-secret-key: itheimaElephantJavaAdminJwtSecretKey2026
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 用户端配置
    user-secret-key: itheimaElephantJavaUserJwtSecretKey2026
    user-ttl: 7200000
    user-token-name: token

